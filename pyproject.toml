[project]
name = "projector-align"
version = "0.1.0"
description = "Camera-based detector that tells whether two edge-blended projectors have drifted out of alignment, developed against a physical simulator."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    # OpenCV 5 interpolates float32 warps continuously; 4.x rounds sub-pixel positions to 1/32 px.
    # tests/test_planar.py::test_warp_is_continuous_subpixel guards this.
    "opencv-python-headless>=5.0,<6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Not an installable package: run everything from the repo root (python -m scripts.<name>).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
