# Question: what is the smallest offset each signal detects when the camera sees only the overlap,
# its control strips and the four markers at its ends, at 1.74 px/mm (twice the whole-screen
# camera's)? The sensor is mounted in portrait. Paired with shift_sweep's across variants (same
# seed, content and onset), so zoomed and whole-screen results compare shift for shift. 1.5 px
# (1.56 mm) is added just above the zoomed echo floor, max(MIN_OFFSET_MM, 2.5 px / 1.74) = 1.5 mm.
extends: _lecture_hall.yaml
name: camera_zoomed
seed: 21
duration_s: 1200
camera: {preset: zoomed, px_per_mm: 1.74, margin: null}
content:
  loop: true
  items:
    - {type: deck, densities: [low, medium, high], slides: 5, hold_s: 37, border_frac: 0.05}
    - {type: black, hold_s: 6}
perturbation:
  b: {kind: shift, magnitude_px: 1, direction: across, schedule: {type: step, t0_s: 615}}
sweep:
  perturbation.b.magnitude_px: [0, 0.25, 0.5, 1, 1.5, 2, 4, 8]
