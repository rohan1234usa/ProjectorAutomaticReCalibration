# Question: how does detection depend on the size and direction of a shift?
# Projector B steps at 615 s (mid-interval, after the 600 s trusted window) by 0 (the aligned twin),
# 0.25, 0.5, 1, 2, 4 or 8 projector pixels (1 px = 1.04 mm), either across the overlap edge (away
# from A: the overlap narrows) or along it, then holds for 19 check intervals. Slide decks
# alternate with 6 s of black, so dark frames show each projector's raster edges.
extends: _lecture_hall.yaml
name: shift_sweep
seed: 21
duration_s: 1200
content:
  loop: true
  items:
    - {type: deck, densities: [low, medium, high], slides: 5, hold_s: 37, border_frac: 0.05}
    - {type: black, hold_s: 6}
perturbation:
  b: {kind: shift, magnitude_px: 1, direction: across, schedule: {type: step, t0_s: 615}}
sweep:
  perturbation.b.magnitude_px: [0, 0.25, 0.5, 1, 2, 4, 8]
  perturbation.b.direction: [across, along]
